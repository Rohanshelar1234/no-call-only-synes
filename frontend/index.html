<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Call Just Sync - Real-time Collaboration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Orbs -->
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <!-- Landing Screen -->
    <div class="landing-screen" id="landingScreen">
        <div class="glass-panel" style="padding: 3rem; text-align: center;">
            <div class="logo">🎬 No Call Just Sync</div>
            <div class="tagline">Real-time collaboration without the call</div>
            
            <div class="input-section">
                <input type="text" class="input-field" id="usernameInput" placeholder="Enter your username" maxlength="20">
                <button class="btn" onclick="setUsername()">Continue</button>
            </div>
            
            <div class="room-section" id="roomSection" style="display: none; margin-top: 2rem;">
                <button class="btn" onclick="createRoom()">🏠 Create Room</button>
                <div style="margin: 1rem 0;">
                    <input type="text" class="input-field" id="roomInput" placeholder="Enter Room ID" maxlength="6" style="text-transform: uppercase;">
                    <button class="btn btn-secondary" onclick="joinRoom()">🔗 Join Room</button>
                </div>
                <input type="text" class="input-field" id="passwordInput" placeholder="Room password (optional)" style="width: 200px;">
            </div>
        </div>
    </div>

    <!-- Room Screen -->
    <div class="room-screen" id="roomScreen">
        <!-- Top Bar -->
        <div class="top-bar glass-panel">
            <div class="room-info">
                <div class="room-id" id="roomIdDisplay">Room: -</div>
                <button class="btn copy-btn" onclick="copyRoomId()">📋 Copy</button>
            </div>
            <div class="user-count" id="userCountDisplay">Users: 0</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Users Panel -->
            <div class="users-panel glass-panel">
                <h3>👥 Users</h3>
                <div id="usersList"></div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area glass-panel">
                <h3>💬 Chat</h3>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="typing-indicator" id="typingIndicator"></div>
                
                <div class="chat-input-area">
                    <div class="emoji-bar" id="emojiBar">
                        <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
                        <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
                        <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
                        <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
                        <button class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
                        <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
                        <button class="emoji-btn" onclick="addEmoji('💯')">💯</button>
                        <button class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
                        <button class="emoji-btn" onclick="addEmoji('💡')">💡</button>
                        <button class="emoji-btn" onclick="addEmoji('🎯')">🎯</button>
                        <button class="emoji-btn" onclick="addEmoji('⭐')">⭐</button>
                        <button class="emoji-btn" onclick="addEmoji('🌟')">🌟</button>
                        <button class="emoji-btn" onclick="addEmoji('✨')">✨</button>
                        <button class="emoji-btn" onclick="addEmoji('🎨')">🎨</button>
                        <button class="emoji-btn" onclick="addEmoji('🎭')">🎭</button>
                        <button class="emoji-btn" onclick="addEmoji('🎪')">🎪</button>
                        <button class="emoji-btn" onclick="addEmoji('🎮')">🎮</button>
                        <button class="emoji-btn" onclick="addEmoji('🎵')">🎵</button>
                        <button class="emoji-btn" onclick="addEmoji('🎸')">🎸</button>
                        <button class="emoji-btn" onclick="addEmoji('🎺')">🎺</button>
                    </div>
                    
                    <div class="input-container">
                        <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." maxlength="500">
                        <button class="btn" onclick="sendMessage()">📤 Send</button>
                    </div>
                </div>
            </div>

            <!-- Notepad Panel -->
            <div class="notepad-panel glass-panel">
                <h3>📝 Shared Notepad</h3>
                <textarea class="notepad" id="notepad" placeholder="Start typing... this syncs with everyone in the room!"></textarea>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar glass-panel">
            <div class="connection-status">
                <div class="status-dot"></div>
                <span id="connectionStatus">Connected</span>
            </div>
            <div class="sync-status" id="syncStatus">Synced</div>
        </div>
    </div>

    <!-- Socket.IO CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
