<!DOCTYPE html>
<html>
<head>
  <title>SceneSync - Real-time Co-watching</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: Poppins, sans-serif;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      background: linear-gradient(45deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    .room-box, .video-box, .chat-box {
      background: #18181b;
      padding: 15px;
      margin: 15px 0;
      border-radius: 15px;
      transition: 0.3s;
    }

    .room-box:hover, .video-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #a855f7, #ec4899);
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #ec4899;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin: 5px;
      width: 60%;
      background: #1f1f23;
      color: white;
    }

    iframe {
      width: 100%;
      height: 400px;
      border-radius: 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎬 SceneSync</h1>
  <p class="subtitle">No call, just sync.</p>

  <!-- Room Control Box -->
  <div class="room-box">
    <h2>🎯 Room Control</h2>
    
    <button onclick="createRoom()">🏠 Create Room</button>
    
    <input id="roomInput" placeholder="Enter Room ID" maxlength="10">
    <button onclick="joinRoom()">🔗 Join</button>
    
    <div id="roomDisplay">No Room</div>
    
    <div id="status" style="display: none;"></div>
  </div>

  <!-- Video Box -->
  <div class="video-box">
    <h2>🎬 Video Player</h2>
    
    <input id="urlInput" placeholder="Paste YouTube URL (e.g., https://youtube.com/watch?v=...)">
    <button onclick="setVideo()">▶️ Load</button>
    
    <iframe id="video" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <!-- Chat Box -->
  <div class="chat-box">
    <h2>💬 Live Chat</h2>
    
    <div id="chat"></div>
    
    <input id="msg" placeholder="Type a message..." maxlength="200">
    <button onclick="sendMsg()">📤 Send</button>
  </div>

</div>

<!-- Scripts at the end -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
